{% extends "base.html" %}
{% load static %}


{% block content %}
  <div id="toast" class="fixed z-50 top-4 right-4 hidden"></div>

  <main class="max-w-6xl mx-auto px-4 py-5 sm:py-6 pb-28 sm:pb-10">
    <section class="max-w-3xl mx-auto">
      <a href="{% url 'inventory:dashboard' %}" class="text-sm font-semibold text-slate-500 hover:underline inline-flex items-center gap-1">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4">
          <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
        Kembali ke dashboard
      </a>
      <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight mt-2">Input Void / Return</h1>
      <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">Cukup isi barcode — nama barang diambil otomatis dari katalog.</p>

      <form id="formInput" class="rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-5 sm:p-6 mt-5 space-y-5">
        <!-- Tanggal dan Quantity -->
        <div class="grid sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold uppercase tracking-wide text-slate-500 dark:text-slate-400 mb-1.5">Tanggal *</label>
            <input type="date" id="tanggal" value="2026-09-21" required class="w-full rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-950 px-3.5 py-3 sm:py-2.5 text-base sm:text-sm focus:ring-2 focus:ring-brand-500">
          </div>
          <div>
            <label class="block text-xs font-bold uppercase tracking-wide text-slate-500 dark:text-slate-400 mb-1.5">Quantity *</label>
            <input type="number" id="quantity" min="1" value="1" required class="w-full rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-950 px-3.5 py-3 sm:py-2.5 text-base sm:text-sm focus:ring-2 focus:ring-brand-500">
          </div>
        </div>

        <!-- Nama Kasir dan Nama Otoritas (Desktop: 2 columns, Mobile: stacked below Tanggal) -->
        <div class="grid sm:grid-cols-2 gap-4 sm:order-none order-first">
          <div>
            <label class="block text-xs font-bold uppercase tracking-wide text-slate-500 dark:text-slate-400 mb-1.5">Nama Kasir *</label>
            <input type="text" id="kasir" placeholder="Nama kasir" required class="w-full rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-950 px-3.5 py-3 sm:py-2.5 text-base sm:text-sm focus:ring-2 focus:ring-brand-500">
          </div>
          <div>
            <label class="block text-xs font-bold uppercase tracking-wide text-slate-500 dark:text-slate-400 mb-1.5">Nama Otoritas/MOD *</label>
            <input type="text" id="otoritas" placeholder="Nama otoritas/MOD" required class="w-full rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-950 px-3.5 py-3 sm:py-2.5 text-base sm:text-sm focus:ring-2 focus:ring-brand-500">
          </div>
        </div>

        <!-- Outlet -->
        <div>
          <label class="block text-xs font-bold uppercase tracking-wide text-slate-500 dark:text-slate-400 mb-1.5">Outlet *</label>
          <select id="outlet" required class="w-full rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-950 px-3.5 py-3 sm:py-2.5 text-base sm:text-sm focus:ring-2 focus:ring-brand-500">
            <option value="">Pilih Outlet</option>
            <option value="BT0">BT0</option>
            <option value="BT1">BT1</option>
            <option value="BT2">BT2</option>
            <option value="BT3">BT3</option>
            <option value="BT4">BT4</option>
            <option value="BT5">BT5</option>
            <option value="BT6">BT6</option>
            <option value="BT7">BT7</option>
            <option value="BT8">BT8</option>
            <option value="BT9">BT9</option>
            <option value="BT10">BT10</option>
            <option value="BT11">BT11</option>
            <option value="BT12">BT12</option>
            <option value="BT13">BT13</option>
            <option value="BT14">BT14</option>
            <option value="BT15">BT15</option>
            <option value="BT16">BT16</option>
            <option value="BT17">BT17</option>
            <option value="BT18">BT18</option>
            <option value="BT19">BT19</option>
            <option value="BT20">BT20</option>
            <option value="BT21">BT21</option>
            <option value="BT22">BT22</option>
            <option value="BT23">BT23</option>
            <option value="BT24">BT24</option>
            <option value="BT25">BT25</option>
            <option value="BT26">BT26</option>
            <option value="BT27">BT27</option>
          </select>
        </div>

        <!-- Barcode -->
        <div>
          <label class="block text-xs font-bold uppercase tracking-wide text-slate-500 dark:text-slate-400 mb-1.5">Barcode *</label>
          <div class="flex gap-2">
            <input type="text" id="barcode" placeholder="Scan atau ketik barcode" required class="w-full rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-950 px-3.5 py-3 sm:py-2.5 text-base sm:text-sm focus:ring-2 focus:ring-brand-500 font-mono flex-1">
            <button type="button" class="shrink-0 px-3.5 rounded-xl bg-slate-900 dark:bg-slate-100 text-white dark:text-slate-900 flex items-center gap-2 font-semibold text-sm hover:bg-slate-800">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5">
                <path d="M4 8.5h3.2L8.6 6h6.8l1.4 2.5H20a1 1 0 0 1 1 1V18a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9.5a1 1 0 0 1 1-1z"/>
                <circle cx="12" cy="13" r="3.3"/>
              </svg>
              <span class="hidden sm:inline">Scan</span>
            </button>
          </div>
          <div id="barangInfo" class="mt-2 text-sm hidden">
            <div class="p-3 rounded-lg bg-emerald-50 dark:bg-emerald-900/20 border border-emerald-200 dark:border-emerald-800">
              <div class="flex items-center gap-2">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" class="w-4 h-4 text-emerald-600">
                  <path d="M5 12.5l4.5 4.5L19 7"/>
                </svg>
                <span class="font-semibold text-emerald-800 dark:text-emerald-200" id="namaBarang"></span>
              </div>
            </div>
          </div>
          <div id="barangError" class="mt-2 text-sm hidden">
            <div class="p-3 rounded-lg bg-rose-50 dark:bg-rose-900/20 border border-rose-200 dark:border-rose-800">
              <div class="flex items-center gap-2">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" class="w-4 h-4 text-rose-600">
                  <circle cx="12" cy="12" r="8"/><path d="M12 8v4M12 16h.01"/>
                </svg>
                <span class="font-semibold text-rose-800 dark:text-rose-200">Barcode tidak ditemukan di katalog</span>
              </div>
            </div>
          </div>
        </div>

        <!-- Tipe -->
        <div>
          <label class="block text-xs font-bold uppercase tracking-wide text-slate-500 dark:text-slate-400 mb-1.5">Jenis tindakan *</label>
          <div class="grid grid-cols-2 gap-3">
            <label class="cursor-pointer">
              <input type="radio" name="tipe" value="void" class="peer sr-only" checked>
              <div class="p-3 rounded-xl border-2 border-slate-200 peer-checked:border-rose-500 peer-checked:bg-rose-50 text-center">
                <div class="flex justify-center">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" class="w-6 h-6 text-slate-400">
                    <circle cx="12" cy="12" r="8"/><path d="M6.8 6.8l10.4 10.4"/>
                  </svg>
                </div>
                <div class="font-bold text-sm mt-1">VOID</div>
                <div class="text-[11px] text-slate-500">Batal sebelum transaksi selesai</div>
              </div>
            </label>
            <label class="cursor-pointer">
              <input type="radio" name="tipe" value="return" class="peer sr-only">
              <div class="p-3 rounded-xl border-2 border-slate-200 peer-checked:border-emerald-500 peer-checked:bg-emerald-50 text-center">
                <div class="flex justify-center">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" class="w-6 h-6 text-slate-400">
                    <path d="M9.5 5.5L5 10l4.5 4.5"/><path d="M5 10h9a5 5 0 0 1 0 10h-2.5"/>
                  </svg>
                </div>
                <div class="font-bold text-sm mt-1">RETURN</div>
                <div class="text-[11px] text-slate-500">Barang kembali setelah struk terbit</div>
              </div>
            </label>
          </div>
        </div>

        <!-- No Trans (untuk return) -->
        <div id="blok-notrans" class="hidden">
          <label class="block text-xs font-bold uppercase tracking-wide text-slate-500 dark:text-slate-400 mb-1.5">No. Transaksi * <span class="normal-case font-semibold text-slate-400">(wajib untuk return)</span></label>
          <input type="text" id="notrans" placeholder="Nomor transaksi" class="w-full rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-950 px-3.5 py-3 sm:py-2.5 text-base sm:text-sm focus:ring-2 focus:ring-brand-500">
        </div>

        <!-- H. Jual (untuk return) -->
        <div id="blok-hjual" class="hidden">
          <label class="block text-xs font-bold uppercase tracking-wide text-slate-500 dark:text-slate-400 mb-1.5">Harga Jual * <span class="normal-case font-semibold text-slate-400">(wajib untuk return)</span></label>
          <input type="number" id="hjual" placeholder="Harga jual" min="0" step="0.01" class="w-full rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-950 px-3.5 py-3 sm:py-2.5 text-base sm:text-sm focus:ring-2 focus:ring-brand-500">
        </div>

        <!-- Alasan -->
        <div>
          <label id="labelAlasan" class="block text-xs font-bold uppercase tracking-wide text-slate-500 dark:text-slate-400 mb-1.5">Alasan Void *</label>
          <textarea id="alasan" placeholder="Alasan void/return" required class="w-full rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-950 px-3.5 py-3 sm:py-2.5 text-base sm:text-sm focus:ring-2 focus:ring-brand-500" rows="3"></textarea>
        </div>

        <!-- Foto (untuk return) -->
        <div id="blok-foto" class="hidden">
          <label class="block text-xs font-bold uppercase tracking-wide text-slate-500 dark:text-slate-400 mb-1.5">Foto struk * <span class="normal-case font-semibold text-slate-400">(wajib untuk return)</span></label>
          <input type="file" id="foto" accept="image/*" class="w-full rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-950 px-3.5 py-3 sm:py-2.5 text-base sm:text-sm">
          <div id="previewContainer" class="mt-3 hidden">
            <img id="preview" src="" alt="Preview" class="max-h-48 rounded-xl border border-slate-200">
          </div>
        </div>

        <!-- Buttons -->
        <div class="flex flex-col sm:flex-row gap-2 sm:justify-end pt-1">
          <a href="{% url 'inventory:dashboard' %}" class="px-4 py-2.5 rounded-xl text-sm font-semibold bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 text-center">Batal</a>
          <button type="submit" class="px-5 py-2.5 rounded-xl text-sm font-bold bg-brand-600 text-white hover:bg-brand-700">Simpan Data</button>
        </div>
      </form>
    </section>
  </main>

{% endblock content %}

{% block scripts %}
  <script src="/static/js/input-ready.js"></script>
{% endblock scripts %}
