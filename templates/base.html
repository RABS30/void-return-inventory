<!DOCTYPE html>
<html lang="id">
    <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>VoidReturnApps</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
        darkMode: 'class',
        theme: { extend: {
            fontFamily: { sans: ['"Plus Jakarta Sans"','ui-sans-serif','system-ui','Segoe UI','Roboto','Helvetica','Arial','sans-serif'] },
            colors: { brand: {50:'#eef4ff',100:'#dbe6fe',200:'#bfd3fe',300:'#93b4fd',400:'#608ffa',500:'#3b6bf6',600:'#254ceb',700:'#1d3bd8',800:'#1e33af',900:'#1e318a'} }
        }}
        }
    </script>
    <style>
        body { background-color:#f6f7f9; }
        html.dark body { background-color:#0b0e14; }
        .scroll-x { overflow-x:auto; -webkit-overflow-scrolling:touch; }
        input:focus, select:focus, textarea:focus { outline:none; }
        @keyframes pop { from { opacity:0; transform: translateY(6px) } to { opacity:1; transform:none } }
        .pop { animation: pop .18s ease-out both; }
    </style>
    </head>

    {% include "navbar.html" %}


    <body class="font-sans text-slate-800 dark:text-slate-100 min-h-screen">    
        {% block content %}
        {% endblock content %}
    </body>

    {% block scripts %}
    {% endblock scripts %}


</html>
